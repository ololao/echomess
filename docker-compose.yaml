services:
  redis:
    image: redis:7.4-alpine
    container_name: echomess-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    dns_search: ""
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "${REDIS_PASSWORD}",
          "--no-auth-warning",
          "ping",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - internal
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  chat:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: echomess-chat
    restart: unless-stopped
    command: uv run gunicorn src.app:app --workers 4 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000
    environment:
      - MESSAGE_SECRET_KEY=${MESSAGE_SECRET_KEY}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - ACCESS_TOKEN_EXPIRE_MIN=${ACCESS_TOKEN_EXPIRE_MIN}
      - REFRESH_TOKEN_EXPIRE_DAY=${REFRESH_TOKEN_EXPIRE_DAY}
      - JWT_KEY=${JWT_KEY}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - SCHEMA=${SCHEMA}
      - DOMAIN=${DOMAIN}
      - EMAIL_FROM=${EMAIL_FROM}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - COOKIE_KEY=${COOKIE_KEY}
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - external
      - internal

  nginx:
    image: nginx:alpine
    container_name: echomess-nginx
    restart: always
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/app.conf:ro
      - ./frontend:/usr/share/nginx/html
    depends_on:
      - chat
    networks:
      - external
      - internal
      - web_net
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  db:
    image: postgres:16.4
    restart: always
    container_name: echomess-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 3
    networks:
      - internal
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  migration:
      image: arigaio/atlas:latest
      restart: "no"
      depends_on:
        postgres:
          condition: service_healthy
      volumes:
        - ./migrations:/migrations:ro
      command:
        - migrate
        - apply
        - --url
        - postgres://app_user:app_password@postgres:5432/app_db?sslmode=disable
        - --dir
        - file:///migrations

volumes:
  redis-data:
    driver: local
  pg_data:

networks:
  external:
  internal:
  web_net:
    external: true
