<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EchoMess - Real-time Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="background-globes">
    <div class="globe globe-1"></div>
    <div class="globe globe-2"></div>
  </div>

  <div class="app-container">
    <!-- Join Modal Screen -->
    <div id="join-screen" class="screen active">
      <div class="card join-card">
        <div class="logo-area">
          <div class="logo-icon">⚡</div>
          <h1>EchoMess</h1>
          <p>Instant Real-Time Rooms</p>
        </div>

        <form id="join-form">
          <div class="input-group">
            <label for="username">Your Nickname</label>
            <input type="text" id="username" placeholder="e.g. Alex" required autocomplete="off">
          </div>

          <div class="input-group">
            <label for="room-id">Room Name / ID</label>
            <input type="text" id="room-id" placeholder="e.g. general" required autocomplete="off">
          </div>

          <div class="quick-rooms">
            <span>Quick join:</span>
            <button type="button" class="chip-btn" data-room="general"># general</button>
            <button type="button" class="chip-btn" data-room="lounge"># lounge</button>
            <button type="button" class="chip-btn" data-room="tech"># tech</button>
          </div>

          <button type="submit" class="btn btn-primary btn-block">Enter Room →</button>
        </form>
      </div>
    </div>

    <!-- Chat Screen -->
    <div id="chat-screen" class="screen">
      <header class="chat-header">
        <div class="room-info">
          <div class="room-avatar">#</div>
          <div>
            <h2 id="current-room-title">room</h2>
            <div class="status-indicator">
              <span id="status-dot" class="dot disconnected"></span>
              <span id="status-text">Connecting...</span>
            </div>
          </div>
        </div>
        <button id="leave-btn" class="btn btn-secondary">Leave Room</button>
      </header>

      <main id="message-container" class="message-container">
        <div class="welcome-message">
          <p>👋 Welcome to room <strong id="welcome-room-name">#general</strong>!</p>
          <span class="subtext">Messages sent here are broadcast in real-time.</span>
        </div>
      </main>

      <footer class="chat-footer">
        <form id="message-form">
          <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off" required>
          <button type="submit" class="btn btn-primary send-btn">
            <span>Send</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </form>
      </footer>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
