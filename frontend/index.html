<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <title>EchoMess</title>
  <link rel="stylesheet" href="/css/index.css">
  <script>
    // Применяем сохранённую тему до отрисовки, чтобы не было вспышки светлого фона.
    (function () {
      try {
        var t = localStorage.getItem("echomess-theme") || "light";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
</head>
<body>

  <div id="toast"></div>

  <!-- ГЛАВНОЕ ПРИЛОЖЕНИЕ -->
  <div id="app" class="hidden"></div>

  <!-- ЭКРАН ПОДТВЕРЖДЕНИЯ ПО ПОЧТЕ (по ссылке из письма) -->
  <div id="email-callback" class="screen hidden">
    <div class="card">
      <h1>EchoMess</h1>
      <p id="callback-status">Подтверждаем вашу почту...</p>
    </div>
  </div>

  <!-- ЭКРАН АВТОРИЗАЦИИ -->
  <div id="auth" class="screen">
    <div class="card">
      <h1>EchoMess</h1>
      <p class="muted">Чат без лишних сложностей</p>

      <div class="tabs">
        <button id="tab-login" class="tab active" type="button">Вход</button>
        <button id="tab-register" class="tab" type="button">Регистрация</button>
      </div>

      <!-- Вход -->
      <form id="login-form" class="form">
        <label>
          <span>Email</span>
          <input type="email" id="login-email" placeholder="you@example.com" required autocomplete="email">
        </label>
        <label>
          <span>Пароль</span>
          <input type="password" id="login-password" placeholder="не меньше 10 символов" required autocomplete="current-password">
        </label>
        <button type="submit" class="btn primary">Войти</button>
        <p class="hint">На почту придёт код подтверждения.</p>
      </form>

      <!-- Ввод кода -->
      <form id="code-form" class="form hidden">
        <p class="hint">Мы отправили код на вашу почту. Введите его ниже.</p>
        <label>
          <span>Код подтверждения</span>
          <input type="text" id="login-code" inputmode="numeric" placeholder="123456" required autocomplete="one-time-code">
        </label>
        <button type="submit" class="btn primary">Подтвердить</button>
        <button type="button" id="code-cancel" class="btn ghost">Назад</button>
      </form>

      <!-- Регистрация -->
      <form id="register-form" class="form hidden">
        <label>
          <span>Имя (до 50 символов)</span>
          <input type="text" id="register-name" maxlength="50" placeholder="как вас зовут" required>
        </label>
        <label>
          <span>Email</span>
          <input type="email" id="register-email" placeholder="you@example.com" required autocomplete="email">
        </label>
        <label>
          <span>Пароль (10–25 символов)</span>
          <input type="password" id="register-password" placeholder="не меньше 10 символов" required autocomplete="new-password">
        </label>
        <button type="submit" class="btn primary">Зарегистрироваться</button>
        <p class="hint">На почту придёт ссылка для подтверждения аккаунта.</p>
      </form>

      <!-- Вход через Google (общий для обеих вкладок) -->
      <div class="auth-divider"><span>или</span></div>
      <button id="google-btn" class="btn google" type="button">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
          <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92a8.78 8.78 0 0 0 2.68-6.62z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.34A9 9 0 0 0 9 18z"/>
          <path fill="#FBBC05" d="M3.97 10.72a5.4 5.4 0 0 1 0-3.44V4.94H.96a9 9 0 0 0 0 8.12l3.01-2.34z"/>
          <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.59A9 9 0 0 0 .96 4.94l3.01 2.34C4.68 5.16 6.66 3.58 9 3.58z"/>
        </svg>
        <span>Продолжить с Google</span>
      </button>
    </div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
